version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days after a release before proposing it, so a compromised version is
    # likely to have been caught and withdrawn first.
    cooldown:
      default-days: 3
    groups:
      # Minor and patch updates arrive together in one pull request a week (decision D24).
      # Major updates get a pull request each.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The Node image both of the Dockerfile's stages start from, pinned by digest: a pull request in
  # any week the image has been updated with Debian or Node fixes, which the next release ships.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new major version of Node is a change of its own: .nvmrc, engines and @types/node move
      # with it, and Chloris follows Node's long-term support versions.
      - dependency-name: node
        update-types: ['version-update:semver-major']
