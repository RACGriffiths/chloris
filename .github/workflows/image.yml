name: Docker image

# Checks that the image still builds and starts. Nothing is pushed: release.yml publishes the
# images for releases. To save Actions minutes (D25), this only runs when something that shapes
# the image changes; it can also be started by hand.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
      - .github/scripts/smoke-test-image.sh
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
      - .github/scripts/smoke-test-image.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build and start the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: chloris:ci
          # For the About page (D59): the image is built without the repository.
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check it works
        run: .github/scripts/smoke-test-image.sh chloris:ci "$GITHUB_SHA" "$(jq -r .version package.json)"
